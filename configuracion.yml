#Configuracion para la generacion de señales senoidal, cuadrada y trinagular

Parametros de muestreo:
  # Cantidad de muestras utilizadas por segundo para representar la señal.
  Frecuencia de muestreo: 8000  # Hz
  # Cantidad de muestras que conforman cada señal.
  Numero muestras: 1024

Parametros de la senal:
  Rango de frecuencias:
    Frecuencia minima: 100  # Hz
    Frecuencia maxima: 1000  # Hz
  #rango de amplitudes
  Rango de fases:
    Fase minima: 0  # Grados
    Fase maxima: 360  # Grados