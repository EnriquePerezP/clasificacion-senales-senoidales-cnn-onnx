#Configuracion para la generacion de señales senoidal, cuadrada y trinagular

Parametros de muestreo:
  # Cantidad de muestras utilizadas por segundo para representar la señal.
  Frecuencia de muestreo: 8000  # Hz
  # Cantidad de muestras que conforman cada señal.
  Numero muestras: 1024

Parametros de la senal:
  Rango de frecuencias:
    Frecuencia minima: 100  # Hz
    Frecuencia maxima: 1000  # Hz
  #rango de amplitudes
  Rango de amplitudes:
    Amplitud minima: 0.25
    Amplitud maxima: 1
  Rango de fases:
    Fase minima: 0  # Grados
    Fase maxima: 360  # Grados


#cantidad de señales

Cantidad de senales:
  Cantidad de senoidales: 300
  Cantidad de cuadradas: 150
  Cantidad de triangulares: 150

#funciones de ruido
Ruido:
  Activacion de ruido: True
  Intensidad de ruido:
    Ruido minimo: 0.05
    Ruido maximo: 0.20
    # Intensidades sugeridas para las primeras pruebas.
    Ruido muy bajo: 0.05
    Ruido bajo: 0.10
    Ruido medio: 0.20
    Ruido alto: 0.40


#configuraciones de ia
Semilla: 42

Division de datos:
  # 70 % para aprender, 15 % para validar y 15 % para la evaluacion final.
  Proporcion de entrenamiento: 0.70
  Proporcion de validacion: 0.15
  Proporcion de prueba: 0.15

Entrenamiento:
  # Cantidad de señales que la CNN procesara juntas durante cada paso.
  Tamano de lote: 32
  # Cantidad de recorridos completos por los datos de entrenamiento.
  Numero de epocas: 20
  # Tamaño del paso que usa Adam al actualizar los parámetros de la CNN.
  Tasa de aprendizaje: 0.001
